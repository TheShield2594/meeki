[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodoro-pet"
version = "0.2.0"
description = "A Pomodoro desktop pet (Bichon x Biewer Terrier pup) for KDE Plasma"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
pomodoro-pet = "pomodoro_pet.app:main"

[tool.setuptools]
packages = ["pomodoro_pet"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
